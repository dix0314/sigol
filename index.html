<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ▼▼▼ 여기에 Apps Script 웹앱 주소(/exec 로 끝남)를 붙여 넣으세요. 따옴표는 지우지 마세요. ▼▼▼ -->
<script>var APP_URL = "";</script>
<!-- ▲▲▲ -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>시골 펜션</title>
<meta name="theme-color" content="#ff5a7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시골 펜션">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json" id="mf">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --hot: #ff5a7a; --deep: #ec3f68; --ink: #2b2b33; --sub: #8a8a96; --soft: #ffeef2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }

  /* 앱 화면: 웹앱을 화면 가득 */
  #app { position: fixed; inset: 0; }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  /* 시작 화면: 아이콘 + 점 세 개 */
  #splash { position: fixed; inset: 0; z-index: 5; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; transition: opacity .3s; }
  #splash.bye { opacity: 0; pointer-events: none; }
  #splash img { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 12px 28px -12px rgba(236, 63, 104, .6); }
  .dots { display: flex; gap: 9px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--hot); animation: dot 1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  #slow { text-align: center; padding: 0 24px; }
  #slow p { margin: 0 0 16px; font-size: 18px; line-height: 1.5; color: var(--sub); }

  /* 안내 화면 (어르신도 보기 쉽게: 글씨 18px 이상, 버튼 56px 이상, 한 화면에 할 일 하나) */
  #gate { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: calc(32px + env(safe-area-inset-top)) 24px calc(130px + env(safe-area-inset-bottom)); }
  #gate .logo { width: 96px; height: 96px; border-radius: 23px; margin-bottom: 18px; box-shadow: 0 12px 28px -12px rgba(236, 63, 104, .6); }
  #gate h1 { margin: 0; font-size: 28px; line-height: 1.3; }
  #gate .msg { margin: 14px 0 0; font-size: 19px; line-height: 1.6; color: #55555f; word-break: keep-all; }
  #gate .msg b { color: var(--deep); }
  .btns { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
  .btn { height: 60px; border: 0; border-radius: 16px; font-family: inherit; font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  .btn.main { background: var(--hot); color: #fff; box-shadow: 0 10px 22px -10px rgba(255, 90, 122, .8); }
  .btn.sub { background: #f2f2f5; color: var(--ink); }
  .btn.link { height: 52px; background: none; color: var(--sub); font-size: 18px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
  .steps { width: 100%; max-width: 360px; margin: 22px 0 0; padding: 0; list-style: none; text-align: left; }
  .steps li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-top: 10px; border-radius: 16px; background: var(--soft); font-size: 19px; line-height: 1.45; word-break: keep-all; }
  .steps .no { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--hot); color: #fff; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .steps svg { flex: none; vertical-align: middle; }
  .ico { display: inline-flex; vertical-align: -6px; width: 30px; height: 30px; border-radius: 8px; background: #fff; align-items: center; justify-content: center; color: #1a73e8; box-shadow: 0 0 0 1px #e3e3ea; }

  /* 아이폰: 화면 아래 공유 버튼 쪽을 가리키는 화살표 */
  #arrow { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); margin-left: -28px; width: 56px; color: var(--hot); line-height: 0; animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { #arrow, .dots i { animation: none; } }
  #toast { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2a2a35; color: #fff; padding: 14px 22px; border-radius: 999px; font-size: 18px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <div id="gate" hidden></div>
  <div id="arrow" hidden><svg viewBox="0 0 56 70" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M28 6v54M8 40l20 20 20-20"/></svg></div>
  <div id="app" hidden>
    <iframe id="frame" title="시골 펜션" allow="clipboard-write; vibrate"></iframe>
    <div id="splash">
      <img src="apple-touch-icon.png" alt="">
      <div class="dots" id="dots"><i></i><i></i><i></i></div>
      <div id="slow" hidden>
        <p>잘 안 열리고 있어요</p>
        <div class="btns" style="margin-top:0">
          <button class="btn main" id="retry">다시 시도</button>
          <button class="btn sub" id="direct">시골 펜션 열기</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast"></div>

<script>
(function () {
  var KEY_STORE = "pension_key";
  var READY_MS = 15000;
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isKakao = /KAKAOTALK/i.test(ua);
  var isInApp = /NAVER|BAND\/|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(ua);
  var isIOSOther = isIOS && /CriOS|FxiOS|EdgiOS|Whale|NAVER|GSA\//.test(ua);
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var mobile = isIOS || isAndroid;
  var gate = document.getElementById("gate");
  var ICON = '<img class="logo" src="apple-touch-icon.png" alt="">';
  var SHARE = '<span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M8 10.5H6a1.5 1.5 0 0 0-1.5 1.5v7.5A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5V12A1.5 1.5 0 0 0 18 10.5h-2"/></svg></span>';
  var PLUS = '<span class="ico" style="color:#2b2b33"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg></span>';
  var DOTS3 = '<span class="ico" style="color:#2b2b33;font-weight:900">⋮</span>';

  function $(id) { return document.getElementById(id); }
  function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 2400); }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // ---------- 열쇠 (초대 링크의 ?k= 또는 #k=) ----------
  var m = (location.search + "&" + location.hash.replace(/^#/, "")).match(/[?&]k=([A-Za-z0-9_-]{16,})/);
  if (m) store(KEY_STORE, m[1]);
  var key = load(KEY_STORE);
  var base = location.origin + location.pathname;
  var keyUrl = key ? base + "?k=" + key : base;
  // 주소창에서 열쇠 지우기 — 단, 아이폰 Safari 는 "홈 화면에 추가"가 지금 주소를 그대로 저장하므로 남겨 둠
  //  (아이폰 홈 화면 앱은 Safari 와 저장 공간이 따로라서, 주소에 열쇠가 있어야 처음 열 때 열쇠를 받음)
  if (isIOS && !standalone) {
    var mf = $("mf"); if (mf) mf.parentNode.removeChild(mf);   // 아이폰은 manifest 대신 지금 주소로 설치되게
    if (key && location.href !== keyUrl) history.replaceState(null, "", keyUrl);
  } else if (location.search || location.hash) {
    history.replaceState(null, "", base);
  }

  function copy(text) {
    function done() { toast("주소를 복사했어요"); }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("주소를 길게 눌러 복사해 주세요"); }
      document.body.removeChild(ta);
    }
  }

  // ---------- 안내 화면 ----------
  function show(html, arrow) {
    $("app").hidden = true; gate.hidden = false; $("arrow").hidden = !arrow;
    gate.innerHTML = ICON + html;
  }
  function btn(id, cls, text) { return '<button class="btn ' + cls + '" id="' + id + '">' + text + "</button>"; }
  function on(id, fn) { var el = $(id); if (el) el.onclick = fn; }
  var skipBtn = btn("skip", "link", "설치 없이 바로 쓰기");

  function screenNoUrl() { show("<h1>웹앱 주소를 넣어 주세요</h1><p class=\"msg\">GitHub 의 index.html 맨 위<br><b>APP_URL</b> 따옴표 안에 /exec 주소를 넣어 주세요.</p>"); }
  function screenNoKey(cut) {
    show("<h1>" + (cut ? "초대 링크가 끊겼어요" : "초대 링크로 열어 주세요") + "</h1><p class=\"msg\">" +
      (cut ? "새 초대 링크를 받아서 다시 열어 주세요." : "받은 <b>초대 링크</b>를 눌러서 열어 주세요.") + "</p>");
  }
  function screenKakao() {
    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(keyUrl);   // 카톡 밖 브라우저로 자동 이동
    show("<h1>다른 브라우저로 열어 주세요</h1><p class=\"msg\">카카오톡 안에서는 설치가 안 돼요.<br>아래 버튼을 눌러 주세요.</p><div class=\"btns\">" +
      btn("ext", "main", isIOS ? "Safari로 열기" : "Chrome으로 열기") + btn("cp", "sub", "주소 복사") + skipBtn + "</div>");
    on("ext", function () { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(keyUrl); });
    on("cp", function () { copy(keyUrl); });
  }
  function intentUrl() { return "intent://" + keyUrl.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end"; }
  function screenInApp() {
    if (isAndroid) {
      location.href = intentUrl();
      show("<h1>Chrome으로 열어 주세요</h1><p class=\"msg\">이 앱 안에서는 설치가 안 돼요.</p><div class=\"btns\">" +
        btn("ext", "main", "Chrome으로 열기") + btn("cp", "sub", "주소 복사") + skipBtn + "</div>");
      on("ext", function () { location.href = intentUrl(); });
    } else {
      show("<h1>Safari로 열어 주세요</h1><ol class=\"steps\">" +
        '<li><span class="no">1</span><span>화면 아래나 위의 <b>···</b> 또는 ' + SHARE + " 누르기</span></li>" +
        '<li><span class="no">2</span><span><b>Safari로 열기</b> 누르기</span></li></ol><div class="btns">' +
        btn("cp", "sub", "주소 복사") + skipBtn + "</div>");
    }
    on("cp", function () { copy(keyUrl); });
  }
  function screenIOSOther() {
    show("<h1>Safari로 열어 주세요</h1><p class=\"msg\">아이폰은 <b>Safari</b>에서만<br>홈 화면에 앱을 둘 수 있어요.</p><div class=\"btns\">" +
      btn("cp", "main", "주소 복사") + skipBtn + '</div><p class="msg" style="font-size:17px">복사한 뒤 Safari 를 열고<br>주소창에 붙여 넣어 주세요.</p>');
    on("cp", function () { copy(keyUrl); });
  }
  function screenIOS() {
    show("<h1>홈 화면에 앱 추가하기</h1><ol class=\"steps\">" +
      '<li><span class="no">1</span><span>화면 아래 ' + SHARE + " 공유 버튼 누르기</span></li>" +
      '<li><span class="no">2</span><span>아래로 내려서 ' + PLUS + " <b>홈 화면에 추가</b></span></li>" +
      '<li><span class="no">3</span><span>오른쪽 위 <b>추가</b> 누르기</span></li></ol><div class="btns">' + skipBtn + "</div>", true);
  }
  var bip = null;
  function screenAndroid() {
    show("<h1>시골 펜션 앱 설치</h1><p class=\"msg\">버튼을 누르고 <b>설치</b>를 누르면<br>홈 화면에 앱이 생겨요.</p><div class=\"btns\">" +
      btn("inst", "main", "앱 설치하기") + skipBtn + '</div><ol class="steps" id="manual" hidden>' +
      '<li><span class="no">1</span><span>오른쪽 위 ' + DOTS3 + " 누르기</span></li>" +
      '<li><span class="no">2</span><span><b>앱 설치</b> 또는 <b>홈 화면에 추가</b> 누르기</span></li></ol>');
    on("inst", function () {
      if (bip) {
        bip.prompt();
        bip.userChoice.then(function (c) { if (c.outcome === "accepted") screenInstalled(); });
        bip = null;
      } else { $("manual").hidden = false; $("inst").hidden = true; }
    });
  }
  function screenInstalled() {
    show("<h1>설치됐어요</h1><p class=\"msg\">이제 홈 화면의<br><b>시골 펜션</b> 아이콘으로 열어 주세요.</p><div class=\"btns\">" + btn("go", "sub", "여기서 바로 쓰기") + "</div>");
    on("go", openApp);
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); bip = e; });
  window.addEventListener("appinstalled", function () { if (!gate.hidden) screenInstalled(); });
  document.addEventListener("click", function (e) { if (e.target.id === "skip") { try { sessionStorage.setItem("pension_skip", "1"); } catch (x) {} openApp(); } });

  // ---------- 앱 화면 ----------
  var readyT = null;
  function appSrc() { return APP_URL + (APP_URL.indexOf("?") < 0 ? "?" : "&") + "k=" + encodeURIComponent(key); }
  function openApp() {
    gate.hidden = true; $("arrow").hidden = true; $("app").hidden = false;
    $("splash").classList.remove("bye"); $("splash").hidden = false; $("dots").hidden = false; $("slow").hidden = true;
    $("frame").src = appSrc();
    clearTimeout(readyT);
    readyT = setTimeout(function () { $("dots").hidden = true; $("slow").hidden = false; }, READY_MS);
  }
  on("retry", openApp);
  on("direct", function () { location.href = appSrc(); });
  window.addEventListener("message", function (e) {
    if (!/(\.googleusercontent\.com|script\.google\.com)$/.test(String(e.origin).replace(/:\d+$/, ""))) return;
    var d = e.data || {};
    if (d.pension === "ready") {
      clearTimeout(readyT);
      $("splash").classList.add("bye");
      setTimeout(function () { $("splash").hidden = true; }, 320);
    } else if (d.pension === "denied") {   // 서버에서 열쇠를 막음 → 저장해 둔 열쇠 지우기
      clearTimeout(readyT);
      store(KEY_STORE, null); key = null;
      screenNoKey(true);
    }
  });

  // ---------- 시작: 어떻게 열었는지 보고 화면 고르기 ----------
  var skipped = false; try { skipped = sessionStorage.getItem("pension_skip") === "1"; } catch (e) {}
  if (!APP_URL) screenNoUrl();
  else if (!key) screenNoKey(false);
  else if (isKakao) screenKakao();
  else if (isInApp && !standalone) screenInApp();
  else if (standalone || !mobile || skipped) openApp();
  else if (isIOSOther) screenIOSOther();
  else if (isIOS) screenIOS();
  else screenAndroid();

  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
})();
</script>
</body>
</html>
